<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The airlock, seen from above</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#ffffff"/>

  <!-- Areas -->
  <rect x="215" y="85" width="270" height="210" fill="#f3f6fa"/>
  <text x="60" y="345" fill="#444" font-size="15" font-weight="bold">outside</text>
  <text x="318" y="290" fill="#444" font-size="15" font-weight="bold">airlock</text>
  <text x="680" y="345" fill="#444" font-size="15" font-weight="bold">room</text>

  <!-- Walls: the outer wall with door A, the inner wall with door B, and the airlock's sides -->
  <g stroke="#555" stroke-width="10" stroke-linecap="butt">
    <line x1="210" y1="20" x2="210" y2="160"/>
    <line x1="210" y1="220" x2="210" y2="360"/>
    <line x1="490" y1="20" x2="490" y2="160"/>
    <line x1="490" y1="220" x2="490" y2="360"/>
    <line x1="210" y1="80" x2="490" y2="80"/>
    <line x1="210" y1="300" x2="490" y2="300"/>
  </g>

  <!-- The user's way: in through A, out through B -->
  <line x1="40" y1="190" x2="750" y2="190" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <circle cx="268" cy="190" r="11" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="252" y="173" fill="#222">user</text>

  <!-- Door A: open, its panel slid into the wall -->
  <rect x="206" y="160" width="8" height="60" fill="none" stroke="#2f6db5" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="206" y="100" width="8" height="60" fill="#2f6db5"/>
  <!-- Door B: closed -->
  <rect x="486" y="160" width="8" height="60" fill="#2f6db5"/>

  <!-- Devices of each door: motor, end sensors, passage sensor, lights, buttons -->
  <g id="devices-a">
    <rect x="198" y="86" width="24" height="13" fill="#ffffff" stroke="#333"/>
    <text x="205" y="97" font-size="10" fill="#222">M</text>
    <rect x="216" y="101" width="6" height="6" fill="#e08a00"/>
    <rect x="216" y="213" width="6" height="6" fill="#e08a00"/>
    <line x1="210" y1="160" x2="210" y2="220" stroke="#d0342c" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="206" y="154" width="8" height="6" fill="#d0342c"/>
    <rect x="206" y="220" width="8" height="6" fill="#d0342c"/>
    <circle cx="194" cy="150" r="6" fill="#2fa84f" stroke="#333"/>
    <circle cx="226" cy="146" r="6" fill="#2fa84f" stroke="#333"/>
    <rect x="186" y="228" width="9" height="9" fill="#888" stroke="#333"/>
    <rect x="222" y="232" width="9" height="9" fill="#888" stroke="#333"/>
    <path d="M178,296 h6 l7,-6 v20 l-7,-6 h-6 z" fill="#e08a00" stroke="#333"/>
    <path d="M195,295 q4,5 0,10 M199,292 q6,8 0,16" fill="none" stroke="#333" stroke-width="1.5"/>
  </g>
  <g id="devices-b">
    <rect x="478" y="86" width="24" height="13" fill="#ffffff" stroke="#333"/>
    <text x="485" y="97" font-size="10" fill="#222">M</text>
    <rect x="496" y="101" width="6" height="6" fill="#e08a00"/>
    <rect x="496" y="213" width="6" height="6" fill="#e08a00"/>
    <line x1="490" y1="160" x2="490" y2="220" stroke="#d0342c" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="486" y="154" width="8" height="6" fill="#d0342c"/>
    <rect x="486" y="220" width="8" height="6" fill="#d0342c"/>
    <circle cx="474" cy="146" r="6" fill="#d0342c" stroke="#333"/>
    <circle cx="506" cy="146" r="6" fill="#d0342c" stroke="#333"/>
    <rect x="465" y="232" width="9" height="9" fill="#888" stroke="#333"/>
    <rect x="502" y="232" width="9" height="9" fill="#888" stroke="#333"/>
    <path d="M500,296 h6 l7,-6 v20 l-7,-6 h-6 z" fill="#e08a00" stroke="#333"/>
    <path d="M517,295 q4,5 0,10 M521,292 q6,8 0,16" fill="none" stroke="#333" stroke-width="1.5"/>
  </g>

  <!-- Labels for door A (door B has the same devices) -->
  <g stroke="#999" stroke-width="1">
    <line x1="150" y1="60" x2="199" y2="90"/>
    <line x1="150" y1="118" x2="205" y2="128"/>
    <line x1="140" y1="150" x2="187" y2="150"/>
    <line x1="140" y1="262" x2="188" y2="236"/>
    <line x1="300" y1="118" x2="223" y2="105"/>
    <line x1="300" y1="118" x2="223" y2="215"/>
    <line x1="300" y1="245" x2="213" y2="224"/>
    <line x1="130" y1="306" x2="176" y2="300"/>
  </g>
  <g fill="#222">
    <text x="90" y="58">motor</text>
    <text x="52" y="116">door A (open)</text>
    <text x="20" y="146">light (green),</text>
    <text x="20" y="161">one on each side</text>
    <text x="20" y="268">button,</text>
    <text x="20" y="283">one on each side</text>
    <text x="20" y="310">siren (alarm)</text>
    <text x="304" y="114">"fully open" and</text>
    <text x="304" y="129">"closed" sensors</text>
    <text x="304" y="250">passage sensor (a beam</text>
    <text x="304" y="265">across the doorway)</text>
    <text x="560" y="116">door B (closed,</text>
    <text x="560" y="131">light red)</text>
  </g>
  <line x1="556" y1="124" x2="496" y2="170" stroke="#999" stroke-width="1"/>
</svg>
